name: versioning
description: Creates a version file with branch name and timestamp
inputs:
  target_branch:
    description: 'Target branch name for versioning'
    required: false
runs:
  using: composite
  steps:
  - name: Tag build
    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
    run: echo "${TARGET_BRANCH} $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > public/version
    shell: bash